name: Add or update a resource
description: Propose a dataset, benchmark, simulator, or deployment record.
title: "[Resource]: "
labels: [resource]
body:
  - type: dropdown
    id: resource_type
    attributes:
      label: Resource type
      options: [dataset, benchmark or scenario, simulator or co-simulator, deployment architecture or program]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Resource name
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Publication or primary-source URL
    validations:
      required: true
  - type: input
    id: project_url
    attributes:
      label: Project URL
      description: Dataset, benchmark, simulator, or deployment project page when different from the primary source.
  - type: input
    id: code_url
    attributes:
      label: Code or devkit URL
      description: Leave blank when no executable public artifact is known.
  - type: textarea
    id: verification
    attributes:
      label: Artifact relationship and evidence
      description: State the artifact type, official/author/third-party relationship, and the URL used to verify it.
  - type: textarea
    id: relevance
    attributes:
      label: Intersection relevance and supported tasks
      description: Explain the direct intersection-planning, control, evaluation, or deployment use.
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Proposed metadata and limitations
      description: Include context, scale, participants/capabilities, access or license constraints, and important limitations.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I separated the publication/source, project, and code URLs and checked each supplied link.
          required: true
