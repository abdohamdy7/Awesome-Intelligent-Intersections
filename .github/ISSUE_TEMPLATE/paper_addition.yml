name: Add or update a paper
description: Propose a research-paper record or implementation-link correction.
title: "[Paper]: "
labels: [paper]
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Stable paper URL or DOI
    validations:
      required: true
  - type: input
    id: code_url
    attributes:
      label: Implementation URL
      description: Leave blank when no public implementation is known.
  - type: input
    id: project_url
    attributes:
      label: Project URL
      description: Optional project page when it differs from the publication and implementation URLs.
  - type: dropdown
    id: artifact_type
    attributes:
      label: Artifact type
      options: [not applicable, method implementation, dataset devkit, benchmark or scenarios, simulator or tool source, other research software]
  - type: textarea
    id: verification
    attributes:
      label: Paper-code relationship
      description: Explain how the implementation is linked to the publication, provide the verification evidence URL, and state whether it is official/project, author-released, or third-party.
  - type: dropdown
    id: intersection_context
    attributes:
      label: Intersection context
      options: [signalized, non-signalized, both]
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Traffic, connectivity, control, and evidence assumptions
      description: Include fleet composition/MPR, control authority, communications, and highest demonstrated environment.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the links and claims against the publication or an author/project source.
          required: true
